<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HierarchyTone 探针</title>
<style>
  html, body {
    margin: 0; height: 100%; width: 100%;
    overflow: hidden; position: fixed; inset: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #111; color: #fff;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #ui {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: 1fr 1fr;
    grid-auto-rows: minmax(22vh, auto);
    gap: 10px;
    padding: calc(88px + env(safe-area-inset-top)) 12px 24px;
    overflow-y: auto;
    touch-action: none;
  }
  .cell {
    background: #2a2a2e; border-radius: 12px;
    display: flex; flex-direction: column; justify-content: center;
    min-height: 22vh; padding: 16px;
  }
  .cell.on { background: #3b3b90; outline: 4px solid #8ab4ff; }
  .cell .lv { font-size: 14px; opacity: .55; }
  .cell .name { font-size: 22px; font-weight: 600; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    padding: calc(12px + env(safe-area-inset-top)) 14px 10px;
    background: #000; font-size: 16px; pointer-events: none;
  }
  #hud b { color: #8ab4ff; }
  #hit { position: absolute; inset: 0; z-index: 5; display: none; touch-action: none; }
  #gate {
    position: absolute; inset: 0; z-index: 8;
    width: 100%; height: 100%; border: 0; margin: 0;
    background: #111; color: #fff;
    font: 700 28px/1.5 -apple-system, "PingFang SC", sans-serif;
    -webkit-appearance: none; appearance: none;
  }
  #gate small { display: block; margin-top: 14px; font-size: 18px; font-weight: 500; opacity: .7; }
  #voiceSel { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="hud">请用 Safari 打开</div>
<div id="ui"></div>
<div id="hit"></div>
<button type="button" id="gate">点击屏幕开始<small>只会读手指底下的那一项</small></button>
<input id="spRate" type="hidden" value="4">
<input id="spVol" type="hidden" value="0.8">
<select id="voiceSel" aria-hidden="true"></select>
<script>
const ITEMS = [
  ["L1", "顶部导航"], ["L1", "搜索框"], ["L2", "频道推荐"], ["L2", "频道热榜"],
  ["L3", "新闻卡片甲"], ["L3", "新闻卡片乙"], ["L4", "标题文字"], ["L5", "配图"],
  ["L3", "商品卡片"], ["L4", "价格五十九元"], ["L2", "底部标签栏"], ["L1", "购物车"],
  ["L2", "限时秒杀"], ["L3", "耳机五十九元"], ["L3", "水杯二十九元"], ["L4", "猜你喜欢"],
  ["L5", "商品主图"], ["L3", "连衣裙"], ["L1", "消息中心"], ["L2", "体育频道"]
];
const FREQ = { L1: 523, L2: 392, L3: 294, L4: 220, L5: 165 };
const ui = document.getElementById("ui");
const hud = document.getElementById("hud");
const hit = document.getElementById("hit");
const gate = document.getElementById("gate");

ITEMS.forEach(([lv, name], i) => {
  const el = document.createElement("div");
  el.className = "cell";
  el.dataset.lv = lv;
  el.dataset.sp = name;
  el.dataset.id = "n" + i;
  el.innerHTML = '<span class="lv">' + lv + "</span><span class=\"name\">" + name + "</span>";
  ui.appendChild(el);
});

let ctx = null, lastId = null, lastTap = 0, armed = false, panY = null;

function loadV() {
  const s = document.getElementById("voiceSel");
  const vs = speechSynthesis.getVoices();
  s.innerHTML = "";
  const zh = vs.filter((v) => (v.lang || "").toLowerCase().startsWith("zh"));
  const all = zh.concat(vs.filter((v) => !(v.lang || "").toLowerCase().startsWith("zh")));
  if (!all.length) {
    s.innerHTML = "<option value=\"\">默认</option>";
    return;
  }
  let pick = "";
  all.forEach((v) => {
    const o = document.createElement("option");
    o.value = String(vs.indexOf(v));
    o.textContent = v.name + " (" + v.lang + ")";
    s.appendChild(o);
    const key = ((v.lang || "") + " " + (v.name || "")).toLowerCase();
    if (/zh-cn|zh_cn|zh-hans|普通话|ting/.test(key) && !/zh-tw|zh-hk|meijia|sin-?ji|粤|廣東/.test(key)) {
      pick = o.value;
    } else if (!pick && (v.lang || "").toLowerCase().startsWith("zh")) {
      pick = o.value;
    }
  });
  if (pick) s.value = pick;
}
speechSynthesis.addEventListener("voiceschanged", loadV);
loadV();
setTimeout(loadV, 300);

function speak(txt) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  const vs = speechSynthesis.getVoices();
  const i = parseInt(document.getElementById("voiceSel").value, 10);
  if (vs[i]) {
    u.voice = vs[i];
    u.lang = vs[i].lang;
  }
  u.rate = +document.getElementById("spRate").value;
  u.volume = +document.getElementById("spVol").value;
  speechSynthesis.speak(u);
}
setInterval(function () {
  if (speechSynthesis.speaking && !speechSynthesis.paused) {
    speechSynthesis.pause();
    speechSynthesis.resume();
  }
}, 10000);

function beep(freq) {
  if (!ctx) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.frequency.value = freq;
  o.type = "sine";
  g.gain.setValueAtTime(0.18, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + 0.16);
}

function elementFromTouch(t) {
  hit.style.pointerEvents = "none";
  const el = document.elementFromPoint(t.clientX, t.clientY);
  hit.style.pointerEvents = "auto";
  return el && el.closest ? el.closest(".cell") : null;
}

function explore(t) {
  const cell = elementFromTouch(t);
  document.querySelectorAll(".cell.on").forEach((n) => n.classList.remove("on"));
  if (!cell) {
    lastId = null;
    hud.textContent = "离开元素";
    speechSynthesis.cancel();
    return;
  }
  cell.classList.add("on");
  hud.innerHTML = "<b>" + cell.dataset.lv + "</b> " + cell.dataset.sp;
  if (cell.dataset.id === lastId) return;
  lastId = cell.dataset.id;
  beep(FREQ[cell.dataset.lv] || 300);
  speak(cell.dataset.sp);
}

function midpointY(touches) {
  let y = 0;
  for (let i = 0; i < touches.length; i++) y += touches[i].clientY;
  return y / touches.length;
}

function onTouchStart(e) {
  e.preventDefault();
  if (e.touches.length >= 2) {
    panY = midpointY(e.touches);
    speechSynthesis.cancel();
    return;
  }
  const now = Date.now();
  if (now - lastTap < 380 && lastId) {
    const cur = document.querySelector(".cell.on");
    speak("选中，" + (cur ? cur.dataset.sp : ""));
    beep(880);
    lastTap = 0;
    return;
  }
  lastTap = now;
  explore(e.changedTouches[0]);
}

function onTouchMove(e) {
  e.preventDefault();
  if (e.touches.length >= 2) {
    const y = midpointY(e.touches);
    if (panY != null) ui.scrollTop += panY - y;
    panY = y;
    return;
  }
  panY = null;
  explore(e.changedTouches[0]);
}

function onTouchEnd(e) {
  e.preventDefault();
  if (e.touches.length < 2) panY = null;
}

function unlock() {
  if (armed) return;
  if (/MicroMessenger|DingTalk/i.test(navigator.userAgent)) {
    gate.innerHTML = "请用 Safari 打开<small>微信里不能朗读</small>";
    return;
  }
  armed = true;
  loadV();
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  speak("开始");
  gate.remove();
  hit.style.display = "block";
  hit.addEventListener("touchstart", onTouchStart, { passive: false });
  hit.addEventListener("touchmove", onTouchMove, { passive: false });
  hit.addEventListener("touchend", onTouchEnd, { passive: false });
  hit.addEventListener("touchcancel", onTouchEnd, { passive: false });
  const vs = speechSynthesis.getVoices();
  const i = parseInt(document.getElementById("voiceSel").value, 10);
  const voiceName = vs[i] ? vs[i].name : "未选中文语音";
  hud.textContent = voiceName + " · 4倍速 · 单指朗读";
}

gate.addEventListener("click", unlock);
</script>
</body>
</html>
