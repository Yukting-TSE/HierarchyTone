<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HierarchyTone · iPad 触探探针</title>
<style>
  html, body {
    margin: 0; height: 100%; width: 100%;
    overflow: hidden; position: fixed; inset: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #111; color: #fff;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; overscroll-behavior: none; }
  #ui {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 18vh;
    gap: 8px; padding: 72px 12px 24px;
    overflow: hidden; touch-action: none;
  }
  .cell {
    background: #2a2a2e; border-radius: 12px;
    display: flex; flex-direction: column; justify-content: center;
    padding: 12px; outline: 3px solid transparent;
  }
  .cell.on { background: #3b3b90; outline-color: #8ab4ff; }
  .cell .lv { font-size: 12px; opacity: .55; }
  .cell .name { font-size: 18px; font-weight: 600; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 10px 12px calc(8px + env(safe-area-inset-top));
    background: #000; font-size: 13px; line-height: 1.45;
    z-index: 2; pointer-events: none;
  }
  #hud b { color: #8ab4ff; }
  #hit { position: absolute; inset: 0; z-index: 5; touch-action: none; }
  #arm {
    position: absolute; z-index: 6; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    padding: 18px 28px; font-size: 18px; border: 0; border-radius: 12px;
    background: #4c6fff; color: #fff;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="hud">未开始 · 先点按钮解锁声音<br>若滑动时页面跟着走，说明滚动没锁住</div>
  <div id="ui"></div>
  <div id="hit"></div>
  <button id="arm" type="button">点一下开始触探（解锁音频）</button>
</div>
<script>
const ITEMS = [
  ["L1", "顶部导航"], ["L1", "搜索框"], ["L2", "频道 · 推荐"], ["L2", "频道 · 热榜"],
  ["L3", "新闻卡片甲"], ["L3", "新闻卡片乙"], ["L4", "标题文字"], ["L5", "配图"],
  ["L3", "商品卡片"], ["L4", "价格 59 元"], ["L2", "底部标签栏"], ["L1", "购物车"]
];
const FREQ = { L1: 523, L2: 392, L3: 294, L4: 220, L5: 165, L6: 123 };
const ui = document.getElementById("ui");
const hud = document.getElementById("hud");
const hit = document.getElementById("hit");
const arm = document.getElementById("arm");
ITEMS.forEach(([lv, name], i) => {
  const el = document.createElement("div");
  el.className = "cell";
  el.dataset.lv = lv;
  el.dataset.sp = name;
  el.dataset.id = "n" + i;
  el.innerHTML = '<span class="lv">' + lv + '</span><span class="name">' + name + "</span>";
  ui.appendChild(el);
});
let ctx = null, lastId = null, lastTap = 0, armed = false;
function unlock() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  armed = true;
  arm.remove();
  beep(440, 0.12);
  speak("开始触探。手指按在屏幕上滑动。");
  hud.innerHTML = "已解锁 · 按住滑动读元素 · 快速点两下为选中";
}
function beep(freq, dur) {
  if (!ctx) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.frequency.value = freq;
  o.type = "sine";
  g.gain.setValueAtTime(0.08, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + dur);
}
function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = 1;
  speechSynthesis.speak(u);
}
function elementFromTouch(t) {
  hit.style.pointerEvents = "none";
  const el = document.elementFromPoint(t.clientX, t.clientY);
  hit.style.pointerEvents = "auto";
  return el && el.closest ? el.closest(".cell") : null;
}
function explore(t) {
  const cell = elementFromTouch(t);
  document.querySelectorAll(".cell.on").forEach((n) => n.classList.remove("on"));
  if (!cell) {
    lastId = null;
    hud.innerHTML = "离开元素 · x=" + Math.round(t.clientX) + " y=" + Math.round(t.clientY);
    speechSynthesis.cancel();
    return;
  }
  cell.classList.add("on");
  hud.innerHTML = "<b>" + cell.dataset.lv + "</b> " + cell.dataset.sp +
    " · x=" + Math.round(t.clientX) + " y=" + Math.round(t.clientY);
  if (cell.dataset.id === lastId) return;
  lastId = cell.dataset.id;
  beep(FREQ[cell.dataset.lv] || 300, 0.18);
  setTimeout(() => {
    if (lastId === cell.dataset.id) speak(cell.dataset.lv + "，" + cell.dataset.sp);
  }, 220);
}
function onTouchStart(e) {
  e.preventDefault();
  if (!armed) return;
  const now = Date.now();
  if (now - lastTap < 380 && lastId) {
    const cur = document.querySelector(".cell.on");
    speak("选中，" + (cur ? cur.dataset.sp : ""));
    beep(880, 0.1);
    lastTap = 0;
    return;
  }
  lastTap = now;
  explore(e.changedTouches[0]);
}
function onTouchMove(e) {
  e.preventDefault();
  if (!armed) return;
  explore(e.changedTouches[0]);
}
function bind(el) {
  el.addEventListener("touchstart", onTouchStart, { passive: false });
  el.addEventListener("touchmove", onTouchMove, { passive: false });
  el.addEventListener("touchend", (e) => e.preventDefault(), { passive: false });
}
bind(hit);
bind(document.body);
arm.addEventListener("click", unlock);
arm.addEventListener("touchend", (e) => { e.preventDefault(); unlock(); }, { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
</script>
</body>
</html>
