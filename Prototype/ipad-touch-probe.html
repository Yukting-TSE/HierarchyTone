<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HierarchyTone 探针</title>
<style>
  html, body {
    margin: 0; height: 100%; width: 100%;
    overflow: hidden; position: fixed; inset: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #111; color: #fff;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #ui {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: 1fr 1fr;
    grid-auto-rows: minmax(22vh, auto);
    gap: 10px;
    padding: calc(88px + env(safe-area-inset-top)) 12px 24px;
    overflow-y: auto;
    touch-action: none;
  }
  .cell {
    background: #2a2a2e; border-radius: 12px;
    display: flex; flex-direction: column; justify-content: center;
    min-height: 22vh; padding: 16px;
  }
  .cell.on { background: #3b3b90; outline: 4px solid #8ab4ff; }
  .cell .lv { font-size: 14px; opacity: .55; }
  .cell .name { font-size: 22px; font-weight: 600; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    padding: calc(12px + env(safe-area-inset-top)) 14px 10px;
    background: #000; font-size: 16px; pointer-events: none;
  }
  #hud b { color: #8ab4ff; }
  #hit { position: absolute; inset: 0; z-index: 5; display: none; touch-action: none; }
  #gate {
    position: absolute; inset: 0; z-index: 8;
    width: 100%; height: 100%; border: 0; margin: 0;
    background: #111; color: #fff;
    font: 700 28px/1.5 -apple-system, "PingFang SC", sans-serif;
    -webkit-appearance: none; appearance: none;
  }
  #gate small { display: block; margin-top: 14px; font-size: 18px; font-weight: 500; opacity: .7; }
</style>
</head>
<body>
<div id="hud">请用 Safari 打开</div>
<div id="ui"></div>
<div id="hit"></div>
<button type="button" id="gate">点击屏幕开始<small>只会读手指底下的那一项</small></button>
<script>
const ITEMS = [
  ["L1", "顶部导航"], ["L1", "搜索框"], ["L2", "频道推荐"], ["L2", "频道热榜"],
  ["L3", "新闻卡片甲"], ["L3", "新闻卡片乙"], ["L4", "标题文字"], ["L5", "配图"],
  ["L3", "商品卡片"], ["L4", "价格五十九元"], ["L2", "底部标签栏"], ["L1", "购物车"],
  ["L2", "限时秒杀"], ["L3", "耳机五十九元"], ["L3", "水杯二十九元"], ["L4", "猜你喜欢"],
  ["L5", "商品主图"], ["L3", "连衣裙"], ["L1", "消息中心"], ["L6", "深层嵌套信息"]
];
const F = { 0: 523.25, 1: 392, 2: 293.66, 3: 220, 4: 164.81, 5: 123.47 };
const DUR = 0.2, ATT = 0.015, REL = 0.03, DLY = 0.15;
const SPEECH_RATE = 4;
const SPEECH_VOL = 0.8;
const ui = document.getElementById("ui");
const hud = document.getElementById("hud");
const hit = document.getElementById("hit");
const gate = document.getElementById("gate");

ITEMS.forEach(([lv, name], i) => {
  const el = document.createElement("div");
  el.className = "cell";
  el.dataset.lv = lv;
  el.dataset.sp = name;
  el.dataset.id = "n" + i;
  el.innerHTML = '<span class="lv">' + lv + "</span><span class=\"name\">" + name + "</span>";
  ui.appendChild(el);
});

let ctx = null, lastId = null, lastTap = 0, armed = false, panY = null, mandarinVoice = null;

function voiceKey(v) {
  return ((v.lang || "") + " " + (v.name || "")).toLowerCase().replace(/_/g, "-");
}

function isCantoneseOrRegional(v) {
  return /hk|hong kong|hongkong|tw|taiwan|yue|cantonese|粤|廣東|广东|香港|台灣|台湾|sin-?ji|meijia|國語/.test(voiceKey(v));
}

function isMainlandMandarin(v) {
  if (isCantoneseOrRegional(v)) return false;
  const lang = (v.lang || "").toLowerCase().replace(/_/g, "-");
  const uri = (v.voiceURI || "").toLowerCase().replace(/_/g, "-");
  const name = v.name || "";
  if (/hk|tw|yue/.test(uri)) return false;
  if (lang === "zh-cn" || lang === "zh-hans-cn" || lang.indexOf("zh-cn-") === 0) return true;
  if (uri.indexOf("zh-cn") !== -1) return true;
  if (/中国大陆|中国大陸/.test(name)) return true;
  if (name === "普通话") return true;
  return false;
}

function pickMandarinVoice() {
  const vs = speechSynthesis.getVoices() || [];
  return vs.find(isMainlandMandarin) || null;
}

function speak(txt) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = "zh-CN";
  u.rate = SPEECH_RATE;
  u.volume = SPEECH_VOL;
  mandarinVoice = pickMandarinVoice();
  if (mandarinVoice) u.voice = mandarinVoice;
  speechSynthesis.speak(u);
}
speechSynthesis.addEventListener("voiceschanged", function () {
  mandarinVoice = pickMandarinVoice();
});
setTimeout(function () { mandarinVoice = pickMandarinVoice(); }, 300);
setInterval(function () {
  if (speechSynthesis.speaking && !speechSynthesis.paused) {
    speechSynthesis.pause();
    speechSynthesis.resume();
  }
}, 10000);

function levelIndex(lv) {
  const n = parseInt(String(lv).replace(/^L/i, ""), 10);
  if (isNaN(n) || n < 1) return 0;
  return Math.min(5, n - 1);
}

function ensureAudio() {
  if (navigator.audioSession) {
    try { navigator.audioSession.type = "playback"; } catch (err) {}
  }
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

function playTone(lv) {
  const c = ensureAudio();
  if (!c) return;
  const f = F[lv] || 523.25;
  const t0 = c.currentTime;
  [[f, 0.34], [f * 2, 0.04], [f * 3, 0.014]].forEach(function (part) {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(part[0], t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(part[1], t0 + ATT);
    g.gain.setValueAtTime(part[1], t0 + DUR - REL);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + DUR);
    o.connect(g);
    g.connect(c.destination);
    o.start(t0);
    o.stop(t0 + DUR + 0.02);
  });
}

function elementFromTouch(t) {
  hit.style.pointerEvents = "none";
  const el = document.elementFromPoint(t.clientX, t.clientY);
  hit.style.pointerEvents = "auto";
  return el && el.closest ? el.closest(".cell") : null;
}

function explore(t) {
  const cell = elementFromTouch(t);
  document.querySelectorAll(".cell.on").forEach((n) => n.classList.remove("on"));
  if (!cell) {
    lastId = null;
    hud.textContent = "离开元素";
    speechSynthesis.cancel();
    return;
  }
  cell.classList.add("on");
  hud.innerHTML = "<b>" + cell.dataset.lv + "</b> " + cell.dataset.sp;
  if (cell.dataset.id === lastId) return;
  lastId = cell.dataset.id;
  speechSynthesis.cancel();
  const lv = levelIndex(cell.dataset.lv);
  playTone(lv);
  setTimeout(function () {
    if (lastId === cell.dataset.id) speak(cell.dataset.sp);
  }, (DUR + DLY) * 1000);
}

function midpointY(touches) {
  let y = 0;
  for (let i = 0; i < touches.length; i++) y += touches[i].clientY;
  return y / touches.length;
}

function onTouchStart(e) {
  e.preventDefault();
  if (e.touches.length >= 2) {
    panY = midpointY(e.touches);
    speechSynthesis.cancel();
    return;
  }
  const now = Date.now();
  if (now - lastTap < 380 && lastId) {
    const cur = document.querySelector(".cell.on");
    const lv = cur ? levelIndex(cur.dataset.lv) : 0;
    speechSynthesis.cancel();
    playTone(lv);
    setTimeout(function () {
      speak("选中，" + (cur ? cur.dataset.sp : ""));
    }, (DUR + DLY) * 1000);
    lastTap = 0;
    return;
  }
  lastTap = now;
  explore(e.changedTouches[0]);
}

function onTouchMove(e) {
  e.preventDefault();
  if (e.touches.length >= 2) {
    const y = midpointY(e.touches);
    if (panY != null) ui.scrollTop += panY - y;
    panY = y;
    return;
  }
  panY = null;
  explore(e.changedTouches[0]);
}

function onTouchEnd(e) {
  e.preventDefault();
  if (e.touches.length < 2) panY = null;
}

function unlock() {
  if (armed) return;
  if (/MicroMessenger|DingTalk/i.test(navigator.userAgent)) {
    gate.innerHTML = "请用 Safari 打开<small>微信里不能朗读</small>";
    return;
  }
  armed = true;
  mandarinVoice = pickMandarinVoice();
  ensureAudio();
  playTone(0);
  setTimeout(function () { speak("开始"); }, (DUR + DLY) * 1000);
  gate.remove();
  hit.style.display = "block";
  hit.addEventListener("touchstart", onTouchStart, { passive: false });
  hit.addEventListener("touchmove", onTouchMove, { passive: false });
  hit.addEventListener("touchend", onTouchEnd, { passive: false });
  hit.addEventListener("touchcancel", onTouchEnd, { passive: false });
  hud.textContent = mandarinVoice
    ? "单指滑动朗读 · 双指翻页"
    : "未找到普通话，请在系统设置中下载普通话语音";
}

gate.addEventListener("click", unlock);
</script>
</body>
</html>
